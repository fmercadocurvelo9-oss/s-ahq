
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build mod
        run: chmod +x ./gradlew && ./gradlew build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: PvPMods-jar
          path: build/libs/*.jar
          
